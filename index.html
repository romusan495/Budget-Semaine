<style>
  :root{
    --bg: #EEF2EC;
    --paper: #FBFBF9;
    --ink: #1E2A27;
    --ink-soft: #55635F;
    --line: #DAE0D8;
    --forest: #2F6F5E;
    --forest-dark: #1F4F42;
    --forest-tint: #E1EEE9;
    --gold: #C98A2C;
    --gold-tint: #F7EAD3;
    --rose: #B4595C;
    --rose-tint: #F5E2E1;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 24px;
    color:var(--ink);
  }
  .hero{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px 22px;
    margin-bottom:16px;
  }
  .hero-label{ font-size:14px; color:var(--ink-soft); margin:0 0 6px; }
  .hero-amount{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:52px;
    line-height:1;
    margin:0;
    letter-spacing:-.01em;
  }
  .hero-amount.tight{ color:var(--rose); }
  .hero-sub{ font-size:14px; color:var(--ink-soft); margin:10px 0 20px; }
  .strip{ display:flex; gap:5px; }
  .day{ flex:1; height:34px; border-radius:8px; background:var(--line); position:relative; overflow:hidden; }
  .day .fill{ position:absolute; left:0; bottom:0; right:0; background:var(--forest); transition:height .4s ease; }
  .day.over .fill{ background:var(--rose); }
  .day.future{ background:#EFF2ED; }
  .days-row{ display:flex; gap:5px; margin-top:6px; }
  .days-row span{ flex:1; text-align:center; font-size:10px; color:var(--ink-soft); }

  .message{ background:var(--forest-tint); color:var(--forest-dark); border-radius:12px; padding:14px 16px; font-size:14px; margin-bottom:16px; line-height:1.5; }
  .message.warn{ background:var(--rose-tint); color:#7A3436; }
  .message.gold{ background:var(--gold-tint); color:#7A551A; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  .card h2{ font-family:'Fraunces',serif; font-weight:500; font-size:17px; margin:0 0 4px; }
  .card .hint{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5; }
  .row{ display:flex; gap:10px; margin-bottom:10px; }
  input, select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--forest); outline-offset:1px; }
  button{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:15px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid var(--forest);
    background:var(--forest);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  button:active{ transform:scale(.98); }
  button.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); font-weight:400; padding:6px 10px; font-size:13px; }
  button.secondary{ background:transparent; color:var(--forest-dark); }
  button.tab{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  button.tab.active{ background:var(--forest-tint); color:var(--forest-dark); border-color:var(--forest); }
  button:disabled{ opacity:.5; cursor:default; }
  .error{ color:var(--rose); font-size:13px; margin:-4px 0 10px; }

  .tx-list{ list-style:none; margin:0; padding:0; }
  .tx-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .tx-item:first-child{ border-top:none; }
  .tx-main{ display:flex; flex-direction:column; min-width:0; }
  .tx-cat{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:280px; }
  .tx-day{ font-size:12px; color:var(--ink-soft); }
  .tx-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .tx-amount{ font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .empty{ color:var(--ink-soft); font-size:14px; padding:8px 0; }

  .setup{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 24px; }
  .setup p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 0 20px; }
  .setup label{ font-size:13px; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tabs button{ flex:1; }

  .bill-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .bill-row input:first-child{ flex:2; }
  .bill-row input:nth-child(2){ flex:1; max-width:110px; }
  .add-bill{ background:transparent; color:var(--forest-dark); border:1px dashed var(--line); width:100%; margin-top:2px; margin-bottom:14px; }
  .calc-preview{ background:var(--forest-tint); color:var(--forest-dark); border-radius:12px; padding:14px 16px; font-size:14px; margin:14px 0; line-height:1.6; }
  .calc-preview.neg{ background:var(--rose-tint); color:#7A3436; }
  .calc-line{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); padding:3px 0; }

  .history-toggle{ background:none; border:none; color:var(--forest); font-size:14px; padding:4px 0; cursor:pointer; text-decoration:underline; }
  .history-list{ margin-top:12px; }
  .history-row{ display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .history-row .pos{ color:var(--forest-dark); }
  .history-row .neg{ color:var(--rose); }

  .loading{ text-align:center; color:var(--ink-soft); padding:60px 0; font-size:14px; }
  .footer-link{ display:block; text-align:center; margin-top:6px; font-size:12px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; }
  .footer-links{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }

  .file-drop{ border:1.5px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--ink-soft); font-size:13px; cursor:pointer; margin-bottom:12px; }
  .file-drop:hover{ border-color:var(--forest); }
  .import-list{ list-style:none; margin:0 0 14px; padding:0; max-height:400px; overflow:auto; }
  .import-item{ display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:13px; }
  .import-item:first-child{ border-top:none; }
  .import-item .il{ flex:1.4; min-width:0; display:flex; flex-direction:column; }
  .import-item .il .lbl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .import-item .il .dt{ color:var(--ink-soft); font-size:11px; }
  .import-item .ia{ font-family:'IBM Plex Mono',monospace; flex-shrink:0; width:64px; text-align:right; }
  .import-item select{ flex:1; font-size:12px; padding:6px 8px; }
  .import-summary{ font-size:13px; color:var(--ink-soft); margin-bottom:12px; }
  .import-actions{ display:flex; gap:10px; justify-content:flex-end; }

  .install-banner{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--gold-tint);
    color:#7A551A;
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .install-banner .share-icon{ flex-shrink:0; font-size:18px; }
  .install-banner button{
    background:none;
    border:none;
    color:#7A551A;
    text-decoration:underline;
    padding:0;
    font-size:13px;
    font-weight:400;
    flex-shrink:0;
  }
</style>
</head>

<script>
const CATS = ["Courses","Transport","Plaisir","Sante","Maison","Autre"];
const JOURS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const WEEKS_PER_MONTH = 52/12;

let config = null;

let importPreview = null;

let draftBills = [];

const INCOME_LABELS = ["Salaire","Prime d'activité","Aide/Allocation","Remboursement","Autre"];

function fmt(n){
  return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + " " + (config && config.currency ? config.currency : "€");
}

function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function weekKey(d){ return startOfWeek(d).toISOString().slice(0,10); }

async function loadData(){
  try{
    const c = localStorage.getItem('ms-config');
    config = c ? JSON.parse(c) : null;
  }catch(e){ config = null; }
  try{
    const t = localStorage.getItem('ms-transactions');
    transactions = t ? JSON.parse(t) : [];
  }catch(e){ transactions = []; }
  try{
    const inc = localStorage.getItem('ms-incomes');
    incomes = inc ? JSON.parse(inc) : [];
  }catch(e){ incomes = []; }
  if(config && !config.createdAt){
    config.createdAt = new Date().toISOString();
    await saveConfig();
  }
  ready = true;
  render();
}
async function saveConfig(){
  try{ localStorage.setItem('ms-config', JSON.stringify(config)); }
  catch(e){ console.error('save config failed', e); }
}
async function saveTransactions(){
  try{ localStorage.setItem('ms-transactions', JSON.stringify(transactions)); }
  catch(e){ console.error('save transactions failed', e); }
}
async function saveIncomes(){
  try{ localStorage.setItem('ms-incomes', JSON.stringify(incomes)); }
  catch(e){ console.error('save incomes failed', e); }
}

function currentWeekTx(){
  const key = weekKey(new Date());
  return transactions.filter(function(t){ return weekKey(new Date(t.date)) === key; });
}
function currentWeekIncomes(){
  const key = weekKey(new Date());
  return incomes.filter(function(t){ return weekKey(new Date(t.date)) === key; });
}

// Builds the full week-by-week timeline from the account's start up to the
// current week, carrying a deficit (never a surplus) forward into the next
// week. Returns entries in chronological order.
function buildWeeklyTimeline(){
  const anchor = startOfWeek(new Date(config.createdAt || new Date()));
  const current = startOfWeek(new Date());
  const timeline = [];
  let carry = 0;
  let cursor = new Date(anchor);
  let guard = 0;
  while(cursor.getTime() <= current.getTime() && guard < 1000){
    guard++;
    const key = weekKey(cursor);
    const wTx = transactions.filter(function(t){ return weekKey(new Date(t.date)) === key; });
    const wInc = incomes.filter(function(t){ return weekKey(new Date(t.date)) === key; });
    const spent = wTx.reduce(function(s,t){ return s+t.amount; }, 0);
    const income = wInc.reduce(function(s,t){ return s+t.amount; }, 0);
    const carryIn = carry;
    const leftover = config.weeklyBudget + income - spent + carryIn;
    timeline.push({ key:key, start:new Date(cursor), spent:spent, income:income, carryIn:carryIn, leftover:leftover });
    carry = Math.min(leftover, 0);
    cursor.setDate(cursor.getDate()+7);
  }
  return timeline;
}

function pastWeeks(){
  const timeline = buildWeeklyTimeline();
  return timeline.slice(0, -1).reverse().slice(0,6);
}

function billsTotal(bills){
  return (bills||[]).reduce(function(s,b){ return s + (parseFloat(b.amount)||0); }, 0);
}
function computeWeekly(income, bills, savings){
  return (income - billsTotal(bills) - savings) / WEEKS_PER_MONTH;
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = '<div class="loading">Chargement…</div>'; return; }
  if(!config){ renderSetup(app); return; }
  if(importPreview){ renderImportPreview(app); return; }
  if(view === 'settings'){ renderSettings(app); return; }
  renderHome(app);
}

function renderSetup(app){

  app.innerHTML = `

    <h1>On installe ta semaine</h1>
    <div class="setup">
      <p>Choisis comment tu veux définir ton budget hebdomadaire : un montant fixe, ou un calcul à partir de tes revenus et de tes factures.</p>

      <div class="error" id="setup-error" style="display:none;"></div>

      body.innerHTML = `
        <label for="wb">Budget par semaine</label>
        <div class="row">
          <input id="wb" type="number" inputmode="decimal" min="0" step="1" placeholder="150" />
          <select id="cur" style="max-width:90px;">
            <option value="€">€</option>
            <option value="$">$</option>
            <option value="CHF">CHF</option>
          </select>
        </div>
      `;
    } else {
      body.innerHTML = `
        <label for="inc">Revenu mensuel (net)</label>
        <div class="row"><input id="inc" type="number" inputmode="decimal" min="0" step="1" placeholder="1600" /></div>
        <label for="sav">Épargne visée par mois</label>
        <div class="row"><input id="sav" type="number" inputmode="decimal" min="0" step="1" placeholder="50" /></div>
        <label>Factures et charges fixes mensuelles</label>
        <div id="bills-list"></div>
        <button type="button" class="add-bill" id="add-bill">+ Ajouter une facture</button>
        <div class="calc-preview" id="calc-preview"></div>
      `;
      renderBillsList();
      ['inc','sav'].forEach(function(id){
        document.getElementById(id).oninput = updatePreview;
      });
      document.getElementById('add-bill').onclick = function(){
        draftBills.push({id:'b'+Date.now(), label:'', amount:''});
        renderBillsList();
        updatePreview();
      };
      updatePreview();
    }
  }

  function renderBillsList(){
    const el = document.getElementById('bills-list');
    el.innerHTML = draftBills.map(function(b){
      return '<div class="bill-row">' +
        '<input type="text" placeholder="Loyer, électricité..." data-bill-label="' + b.id + '" value="' + (b.label||'').replace(/"/g,'&quot;') + '" />' +
        '<input type="number" inputmode="decimal" step="1" placeholder="0" data-bill-amount="' + b.id + '" value="' + (b.amount||'') + '" />' +
        '<button type="button" class="ghost" data-bill-del="' + b.id + '" aria-label="Supprimer">x</button>' +
      '</div>';
    }).join('');
    el.querySelectorAll('[data-bill-label]').forEach(function(inp){
      inp.oninput = function(){
        const b = draftBills.find(function(x){ return x.id === inp.getAttribute('data-bill-label'); });
        b.label = inp.value;
      };
    });
    el.querySelectorAll('[data-bill-amount]').forEach(function(inp){
      inp.oninput = function(){
        const b = draftBills.find(function(x){ return x.id === inp.getAttribute('data-bill-amount'); });
        b.amount = inp.value;
        updatePreview();
      };
    });
    el.querySelectorAll('[data-bill-del]').forEach(function(btn){
      btn.onclick = function(){
        draftBills = draftBills.filter(function(x){ return x.id !== btn.getAttribute('data-bill-del'); });
        renderBillsList();

    const pv = document.getElementById('calc-preview');
    if(!pv) return;
    const income = parseFloat(document.getElementById('inc').value) || 0;
    const savings = parseFloat(document.getElementById('sav').value) || 0;
    const total = billsTotal(draftBills);
    const weekly = computeWeekly(income, draftBills, savings);
    pv.className = 'calc-preview' + (weekly < 0 ? ' neg' : '');
    pv.innerHTML = '<div class="calc-line"><span>Revenu</span><span>' + income.toLocaleString('fr-FR') + ' €</span></div>' +

      '<div class="calc-line"><span>Épargne</span><span>-' + savings.toLocaleString('fr-FR') + ' €</span></div>' +

  document.getElementById('tab-calc').onclick = function(){ mode='calc'; renderBody(); };
  renderBody();

  document.getElementById('setup-go').onclick = async function(){
    const errEl = document.getElementById('setup-error');
    if(mode === 'simple'){
      const val = parseFloat(document.getElementById('wb').value);
      if(!val || val <= 0){
        errEl.textContent = "Entre un montant supérieur à 0.";
        errEl.style.display = 'block';
        return;
      }
      config = { weeklyBudget: val, currency: document.getElementById('cur').value, mode:'simple', createdAt: new Date().toISOString() };
    } else {
      const income = parseFloat(document.getElementById('inc').value) || 0;
      const savings = parseFloat(document.getElementById('sav').value) || 0;
      if(income <= 0){
        errEl.textContent = "Entre un revenu mensuel supérieur à 0.";
        errEl.style.display = 'block';
        return;
      }
      const bills = draftBills.filter(function(b){ return b.label.trim() !== '' || parseFloat(b.amount) > 0; })
        .map(function(b){ return {id:b.id, label:b.label.trim()||'Facture', amount: parseFloat(b.amount)||0}; });
      const weekly = computeWeekly(income, bills, savings);
      config = { weeklyBudget: Math.max(0, Math.round(weekly*100)/100), currency:'€', mode:'calc', income:income, savingsGoal:savings, bills:bills, createdAt: new Date().toISOString() };
    }
    errEl.style.display = 'none';
    draftBills = [];
    await saveConfig();
    render();
  };
}

function dayStripHTML(spentByDay, dailyTarget){
  const today = (new Date().getDay() + 6) % 7;
  let strip = '<div class="strip">';
  for(let i=0;i<7;i++){
    const spent = spentByDay[i] || 0;
    const isFuture = i > today;
    const isOver = spent > dailyTarget && dailyTarget > 0;
    let pct = dailyTarget > 0 ? Math.min(100, (spent/dailyTarget)*100) : 0;
    if(isFuture) pct = 0;
    strip += '<div class="day ' + (isOver && !isFuture ? 'over':'') + ' ' + (isFuture?'future':'') + '"><div class="fill" style="height:' + pct + '%"></div></div>';
  }
  strip += '</div><div class="days-row">';
  JOURS.forEach(function(j,i){ strip += '<span style="' + (i===today?'color:var(--forest);font-weight:600;':'') + '">' + j + '</span>'; });
  strip += '</div>';
  return strip;
}

function computeMessage(remaining, weeklyBudget, dayIndex){
  const expectedRemaining = weeklyBudget - (weeklyBudget/7)*(dayIndex+1);
  const diff = remaining - expectedRemaining;
  const ratio = weeklyBudget > 0 ? diff / weeklyBudget : 0;
  if(remaining < 0){
    return {cls:'warn', text:"Le budget de la semaine est dépassé. Ça arrive, regarde simplement ce qui a coûté cher, et la semaine prochaine repart à zéro."};
  }
  if(ratio > 0.08){
    return {cls:'gold', text:"Belle avance sur ton budget cette semaine. Tu peux souffler un peu."};
  }
  if(ratio < -0.08){
    return {cls:'warn', text:"Le rythme est un peu serré cette semaine. Rien de grave, essaie d'y aller doucement sur les prochains jours."};
  }
  return {cls:'', text:"Tu es dans le rythme de ton budget cette semaine. Continue comme ça."};
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function installBannerHTML(){
  if(isStandalone() || !isIOS()) return '';
  try{ if(localStorage.getItem('ms-install-dismissed') === '1') return ''; }catch(e){}
  return '<div class="install-banner"><span class="share-icon">&#x2191;&#x25A1;</span>' +
    '<span>Installe cette app sur ton iPhone : appuie sur le bouton de partage de Safari, puis "Sur l\'écran d\'accueil".</span>' +
    '<button id="dismiss-install">OK</button></div>';
}

function renderHome(app){
  const weekTx = currentWeekTx();
  const weekInc = currentWeekIncomes();
  const spent = weekTx.reduce(function(s,t){ return s+t.amount; },0);
  const incomeThisWeek = weekInc.reduce(function(s,t){ return s+t.amount; },0);

  const timeline = buildWeeklyTimeline();
  const thisWeekEntry = timeline[timeline.length-1];
  const carryIn = thisWeekEntry ? thisWeekEntry.carryIn : 0;
  const remaining = config.weeklyBudget + incomeThisWeek - spent + carryIn;

  const today = (new Date().getDay() + 6) % 7;
  const dailyTarget = config.weeklyBudget / 7;

  const spentByDay = [0,0,0,0,0,0,0];
  weekTx.forEach(function(t){
    const d = (new Date(t.date).getDay() + 6) % 7;
    spentByDay[d] += t.amount;
  });

  const msg = computeMessage(remaining, config.weeklyBudget, today);

  const movements = weekTx.map(function(t){ return {id:t.id, type:'tx', date:t.date, label:t.category + (t.note ? (' - ' + t.note) : ''), amount:t.amount}; })
    .concat(weekInc.map(function(t){ return {id:t.id, type:'inc', date:t.date, label:t.label + (t.note ? (' - ' + t.note) : ''), amount:t.amount}; }))
    .sort(function(a,b){ return new Date(b.date) - new Date(a.date); });

  const txHTML = movements.length === 0
    ? '<p class="empty">Aucun mouvement ajouté cette semaine.</p>'
    : '<ul class="tx-list">' + movements.map(function(m){
        const d = new Date(m.date);
        const label = JOURS[(d.getDay()+6)%7];
        const sign = m.type === 'inc' ? '+' : '-';
        return '<li class="tx-item">' +
          '<div class="tx-main">' +
            '<span class="tx-cat">' + m.label + '</span>' +
            '<span class="tx-day">' + label + '</span>' +
          '</div>' +
          '<div class="tx-right">' +
            '<span class="tx-amount" style="' + (m.type==='inc' ? 'color:var(--forest-dark);' : '') + '">' + sign + fmt(m.amount) + '</span>' +
            '<button class="ghost" data-id="' + m.id + '" data-kind="' + m.type + '" aria-label="Supprimer">x</button>' +
          '</div>' +
        '</li>';
      }).join('') + '</ul>';

  const history = pastWeeks();
  const historyHTML = history.length === 0
    ? '<p class="empty">Pas encore d historique.</p>'
    : history.map(function(entry){
        const label = entry.start.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const cls = entry.leftover >= 0 ? 'pos' : 'neg';
        const text = entry.leftover >= 0 ? ('reste ' + fmt(entry.leftover)) : ('découvert de ' + fmt(-entry.leftover));
        return '<div class="history-row"><span>Semaine du ' + label + '</span><span class="' + cls + '">' + text + '</span></div>';
      }).join('');

  app.innerHTML = `
    <p class="eyebrow">Cette semaine</p>
    <h1>Ma semaine</h1>

    ${installBannerHTML()}

    <div class="hero">
      <p class="hero-label">Il te reste à dépenser</p>
      <p class="hero-amount ${remaining < 0 ? 'tight' : ''}">${fmt(remaining)}</p>
      <p class="hero-sub">sur ${fmt(config.weeklyBudget)} cette semaine${incomeThisWeek > 0 ? ', + ' + fmt(incomeThisWeek) + ' de rentrées' : ''}, ${fmt(spent)} dépensés${carryIn < 0 ? ', dont ' + fmt(-carryIn) + ' reporté de la semaine dernière' : ''}</p>
      ${dayStripHTML(spentByDay, dailyTarget)}
    </div>

    <div class="message ${msg.cls}">${msg.text}</div>

    <div class="card">
      <h2>Ajouter une dépense</h2>
      <div class="row">
        <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Montant" style="max-width:130px;" />
        <select id="cat">
          ${CATS.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('')}
        </select>
      </div>
      <div class="row">
        <input id="note" type="text" placeholder="Note (facultatif)" />
        <button id="add-tx">Ajouter</button>
      </div>
      <div class="error" id="tx-error" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>Ajouter une rentrée d'argent</h2>
      <p class="hint">Salaire, prime d'activité, aide, remboursement... ça vient s'ajouter à ce qu'il te reste cette semaine.</p>
      <div class="row">
        <input id="inc-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Montant" style="max-width:130px;" />
        <select id="inc-label">
          ${INCOME_LABELS.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('')}
        </select>
      </div>
      <div class="row">
        <input id="inc-note" type="text" placeholder="Note (facultatif)" />
        <button id="add-inc">Ajouter</button>
      </div>
      <div class="error" id="inc-error" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>Importer un relevé bancaire</h2>
      <p class="hint">Depuis l'espace client de ta banque (Crédit Agricole, Société Générale, BNP, LCL, etc.), télécharge tes opérations au format CSV, puis importe le fichier ici.</p>
      <label class="file-drop" for="bank-file">Choisir un fichier CSV</label>
      <input id="bank-file" type="file" accept=".csv,text/csv" style="display:none;" />
      <div class="error" id="import-error" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>Mouvements de la semaine</h2>
      ${txHTML}
    </div>

    <div class="card">
      <button class="history-toggle" id="hist-toggle">Voir les semaines précédentes</button>
      <div class="history-list" id="hist-list" style="display:none;">${historyHTML}</div>
    </div>

    <div class="card">
      <h2>Sauvegarde</h2>
      <p class="hint">Pas de synchronisation automatique entre le navigateur et l'iPhone pour l'instant : exporte un fichier de sauvegarde ici, et importe-le sur l'autre appareil pour reporter tes données.</p>
      <div class="row">
        <button class="secondary" id="export-data" style="width:100%;">Exporter mes données</button>
        <label class="secondary" id="import-data-label" for="import-data-file" style="flex:1; text-align:center; padding:10px 16px; border-radius:10px; border:1px solid var(--line); cursor:pointer; color:var(--forest-dark);">Importer</label>
        <input id="import-data-file" type="file" accept="application/json" style="display:none;" />
      </div>
      <div class="error" id="backup-error" style="display:none;"></div>
    </div>

    <div class="footer-links">
      <button class="footer-link" id="edit-budget">Modifier le budget hebdomadaire</button>
    </div>
  `;

  document.getElementById('add-tx').onclick = async function(){
    const amt = parseFloat(document.getElementById('amt').value);
    const errEl = document.getElementById('tx-error');
    if(!amt || amt <= 0){
      errEl.textContent = "Entre un montant valide.";
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    transactions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      amount: Math.round(amt*100)/100,
      category: document.getElementById('cat').value,
      note: document.getElementById('note').value.trim(),
      date: new Date().toISOString(),
      source: 'manual'
    });
    await saveTransactions();
    render();
  };

  document.getElementById('add-inc').onclick = async function(){
    const amt = parseFloat(document.getElementById('inc-amt').value);
    const errEl = document.getElementById('inc-error');
    if(!amt || amt <= 0){
      errEl.textContent = "Entre un montant valide.";
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    incomes.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      amount: Math.round(amt*100)/100,
      label: document.getElementById('inc-label').value,
      note: document.getElementById('inc-note').value.trim(),
      date: new Date().toISOString(),
      source: 'manual'
    });
    await saveIncomes();
    render();
  };

  app.querySelectorAll('[data-id]').forEach(function(btn){
    btn.onclick = async function(){
      const id = btn.getAttribute('data-id');
      const kind = btn.getAttribute('data-kind');
      if(kind === 'inc'){
        incomes = incomes.filter(function(t){ return t.id !== id; });
        await saveIncomes();
      } else {
        transactions = transactions.filter(function(t){ return t.id !== id; });
        await saveTransactions();
      }
      render();
    };
  });

  document.getElementById('hist-toggle').onclick = function(){
    const el = document.getElementById('hist-list');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  };

  const dismissBtn = document.getElementById('dismiss-install');
  if(dismissBtn){
    dismissBtn.onclick = function(){
      try{ localStorage.setItem('ms-install-dismissed', '1'); }catch(e){}
      render();
    };
  }

  document.getElementById('edit-budget').onclick = function(){
    view = 'settings';
    draftBills = config.bills && config.bills.length ? config.bills.map(function(b){ return {id:b.id, label:b.label, amount:String(b.amount)}; }) : [{id:'b0', label:'', amount:''}];
    render();
  };

  document.getElementById('export-data').onclick = function(){
    const payload = { config: config, transactions: transactions, incomes: incomes, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'ma-semaine-sauvegarde-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  };

  document.getElementById('import-data-file').onchange = function(evt){
    const file = evt.target.files[0];
    const errEl = document.getElementById('backup-error');
    errEl.style.display = 'none';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function(e){
      try{
        const data = JSON.parse(e.target.result);
        if(!data || typeof data !== 'object' || !data.config){
          throw new Error('format invalide');
        }
        const ok = confirm("Importer ce fichier va remplacer toutes les données actuellement sur cet appareil (budget, dépenses, rentrées d'argent). Continuer ?");
        if(!ok) return;
        config = data.config;
        transactions = Array.isArray(data.transactions) ? data.transactions : [];
        incomes = Array.isArray(data.incomes) ? data.incomes : [];
        await saveConfig();
        await saveTransactions();
        await saveIncomes();
        render();
      }catch(err){
        console.error(err);
        errEl.textContent = "Ce fichier ne ressemble pas à une sauvegarde valide de l'app.";
        errEl.style.display = 'block';
      }
    };
    reader.readAsText(file);
  };

  document.getElementById('bank-file').onchange = function(evt){
    const file = evt.target.files[0];
    const errEl = document.getElementById('import-error');
    errEl.style.display = 'none';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const buf = e.target.result;
        let text = decodeBankBuffer(buf);
        const rows = parseBankCSV(text);
        if(rows.length === 0){
          errEl.textContent = "Aucune dépense reconnue dans ce fichier. Vérifie que c'est bien un export CSV des opérations.";
          errEl.style.display = 'block';
          return;
        }
        importPreview = rows.map(function(r, i){
          const dupe = transactions.some(function(t){
            return t.date.slice(0,10) === r.date && Math.abs(t.amount - r.amount) < 0.005 && t.note === r.merchant;
          });
          return { id: 'imp' + i, date: r.date, merchant: r.merchant, amount: r.amount, category: 'Autre', checked: !dupe, dupe: dupe };
        });
        render();
      }catch(err){
        console.error(err);
        errEl.textContent = "Impossible de lire ce fichier. Vérifie qu'il s'agit bien d'un CSV exporté par ta banque.";
        errEl.style.display = 'block';
      }
    };
    reader.readAsArrayBuffer(file);
  };
}

function decodeBankBuffer(buf){
  let text;
  try{
    text = new TextDecoder('utf-8', {fatal:false}).decode(buf);
  }catch(e){ text = ''; }
  const badCount = (text.match(/\uFFFD/g)||[]).length;
  if(badCount > 2){
    try{
      text = new TextDecoder('windows-1252').decode(buf);
    }catch(e){ /* keep utf-8 fallback */ }
  }
  return text;
}

function stripAccents(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function parseCSVFull(text, delim){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
    } else {
      if(ch === '"'){ inQuotes = true; }
      else if(ch === delim){ row.push(field); field=''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field += ch; }
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function parseFrenchNumber(str){
  if(str === undefined || str === null) return NaN;
  let s = String(str).trim();
  if(s === '') return NaN;
  s = s.replace(/\s/g,'').replace(/€|\$|CHF/gi,'');
  if(s.indexOf(',') > -1 && s.indexOf('.') > -1){
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(s.indexOf(',') > -1){
    s = s.replace(',', '.');
  }
  return parseFloat(s);
}

function parseFrenchDate(str){
  if(!str) return null;
  const s = str.trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{2,4})/);
  if(m){
    let yy = m[3];
    if(yy.length === 2) yy = '20' + yy;
    const dd = m[1].padStart(2,'0');
    const mm = m[2].padStart(2,'0');
    return yy + '-' + mm + '-' + dd;
  }
  return null;
}

function findCol(headers, keywords){
  for(let i=0;i<headers.length;i++){
    const h = stripAccents(headers[i].toLowerCase());
    for(let k=0;k<keywords.length;k++){
      if(h.indexOf(keywords[k]) > -1) return i;
    }
  }
  return -1;
}

function pickMerchant(detail){
  const parts = detail.split(' - ').map(function(p){ return p.trim(); }).filter(function(p){ return p.length > 0; });
  if(parts.length === 0) return detail.trim();
  if(parts.length === 1) return parts[0];
  let best = parts[0];
  let bestScore = Infinity;
  parts.forEach(function(p){
    const digits = (p.match(/[0-9]/g)||[]).length;
    const score = digits / p.length;
    if(score < bestScore){ bestScore = score; best = p; }
  });
  return best;
}

function extractMerchant(rawLabel){
  const lines = rawLabel.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
  if(lines.length === 0) return 'Operation';
  const detail = lines.length > 1 ? lines[1] : lines[0];
  const merchant = pickMerchant(detail);
  return (merchant || detail || lines[0]).slice(0,60);
}

function parseBankCSV(text){
  const clean = text.replace(/^\uFEFF/, '');
  let semiCount = (clean.match(/;/g)||[]).length;
  let commaCount = (clean.match(/,/g)||[]).length;
  const delim = semiCount >= 5 ? ';' : (semiCount >= commaCount ? ';' : ',');

  const allRows = parseCSVFull(clean, delim);
  if(allRows.length < 2) return [];

  let headerIdx = -1;
  for(let i=0;i<Math.min(allRows.length,15);i++){
    const joined = stripAccents(allRows[i].join('|').toLowerCase());
    if(joined.indexOf('date') > -1 && (joined.indexOf('libelle') > -1 || joined.indexOf('montant') > -1 || joined.indexOf('debit') > -1 || joined.indexOf('credit') > -1)){
      headerIdx = i;
      break;
    }
  }
  if(headerIdx === -1) return [];

  const headers = allRows[headerIdx];
  const dateCol = findCol(headers, ['date operation','date de valeur','date']);
  const labelCol = findCol(headers, ['libelle simplifie','libelle','description','nature','communication']);
  const debitCol = findCol(headers, ['debit']);
  const creditCol = findCol(headers, ['credit']);
  const montantCol = findCol(headers, ['montant']);

  const results = [];
  for(let i=headerIdx+1;i<allRows.length;i++){
    const cells = allRows[i];
    if(cells.length < 2) continue;
    const dateRaw = dateCol > -1 ? cells[dateCol] : '';
    const date = parseFrenchDate(dateRaw);
    if(!date) continue;
    const rawLabel = labelCol > -1 ? (cells[labelCol]||'') : 'Operation';

    let amount = null;
    if(debitCol > -1 && cells[debitCol] && cells[debitCol].trim() !== ''){
      const v = parseFrenchNumber(cells[debitCol]);
      if(!isNaN(v) && v !== 0) amount = Math.abs(v);
    } else if(debitCol === -1 && montantCol > -1 && cells[montantCol] && cells[montantCol].trim() !== ''){
      const v = parseFrenchNumber(cells[montantCol]);
      if(!isNaN(v) && v < 0) amount = Math.abs(v);
    }
    if(amount === null) continue;

    results.push({ date: date, merchant: extractMerchant(rawLabel), amount: Math.round(amount*100)/100 });
  }
  return results;
}

function renderImportPreview(app){
  const rows = importPreview;
  const selectedCount = rows.filter(function(r){ return r.checked; }).length;
  const selectedTotal = rows.filter(function(r){ return r.checked; }).reduce(function(s,r){ return s + r.amount; }, 0);

  app.innerHTML = `
    <p class="eyebrow">Import</p>
    <h1>Vérifie les opérations</h1>
    <div class="card">
      <p class="import-summary">${rows.length} opération(s) trouvée(s). Décoche celles à ne pas importer et ajuste la catégorie si besoin.</p>
      <ul class="import-list">
        ${rows.map(function(r){
          return '<li class="import-item">' +
            '<input type="checkbox" data-imp="' + r.id + '" ' + (r.checked ? 'checked' : '') + ' />' +
            '<div class="il"><span class="lbl">' + r.merchant + (r.dupe ? ' (déjà présent ?)' : '') + '</span><span class="dt">' + r.date + '</span></div>' +
            '<select data-imp-cat="' + r.id + '">' + CATS.map(function(c){ return '<option value="'+c+'"' + (c===r.category?' selected':'') + '>'+c+'</option>'; }).join('') + '</select>' +
            '<span class="ia">-' + r.amount.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>' +
          '</li>';
        }).join('')}
      </ul>
      <p class="import-summary" id="import-total">${selectedCount} sélectionnée(s), total ${fmt(selectedTotal)}</p>
      <div class="import-actions">
        <button class="secondary" id="import-cancel">Annuler</button>
        <button id="import-confirm">Importer la sélection</button>
      </div>
    </div>
  `;

  function updateTotal(){
    const selected = rows.filter(function(r){ return r.checked; });
    const total = selected.reduce(function(s,r){ return s + r.amount; }, 0);
    document.getElementById('import-total').textContent = selected.length + ' sélectionnée(s), total ' + fmt(total);
  }

  app.querySelectorAll('[data-imp]').forEach(function(cb){
    cb.onchange = function(){
      const row = rows.find(function(r){ return r.id === cb.getAttribute('data-imp'); });
      row.checked = cb.checked;
      updateTotal();
    };
  });
  app.querySelectorAll('[data-imp-cat]').forEach(function(sel){
    sel.onchange = function(){
      const row = rows.find(function(r){ return r.id === sel.getAttribute('data-imp-cat'); });
      row.category = sel.value;
    };
  });

  document.getElementById('import-cancel').onclick = function(){
    importPreview = null;
    render();
  };

  document.getElementById('import-confirm').onclick = async function(){
    const selected = rows.filter(function(r){ return r.checked; });
    selected.forEach(function(r){
      transactions.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6) + r.id,
        amount: r.amount,
        category: r.category,
        note: r.merchant,
        date: new Date(r.date + 'T12:00:00').toISOString(),
        source: 'import'
      });
    });
    await saveTransactions();
    importPreview = null;
    render();
  };
}

function renderSettings(app){
  app.innerHTML = `
    <p class="eyebrow">Réglages</p>
    <h1>Ton budget</h1>
    <div class="setup">
      <div class="tabs">
        <button type="button" class="tab" id="tab-simple">Montant fixe</button>
        <button type="button" class="tab" id="tab-calc">Revenus et factures</button>
      </div>
      <div id="setup-body"></div>
      <div class="error" id="setup-error" style="display:none;"></div>
      <div class="row" style="margin-top:6px;">
        <button class="secondary" id="settings-cancel" style="width:100%;">Annuler</button>
        <button id="settings-save" style="width:100%;">Enregistrer</button>
      </div>
    </div>
    <div class="card">
      <h2>Report d'une semaine à l'autre</h2>
      <p class="hint">Le suivi calcule un report semaine par semaine depuis le ${new Date(config.createdAt).toLocaleDateString('fr-FR')}. Si ce chiffre te semble faux (par exemple après un gros import de relevé), tu peux repartir à zéro : le report ne comptera qu'à partir d'aujourd'hui, sans toucher à tes dépenses déjà enregistrées.</p>
      <button class="secondary" id="reset-carry" style="width:100%;">Repartir à zéro sur le report</button>
    </div>
  `;
  let mode = config.mode === 'calc' ? 'calc' : 'simple';

  function renderBody(){
    document.getElementById('tab-simple').className = 'tab' + (mode==='simple' ? ' active' : '');
    document.getElementById('tab-calc').className = 'tab' + (mode==='calc' ? ' active' : '');
    const body = document.getElementById('setup-body');
    if(mode === 'simple'){
      body.innerHTML = `
        <label for="wb">Budget par semaine</label>
        <div class="row">
          <input id="wb" type="number" inputmode="decimal" min="0" step="1" value="${config.weeklyBudget}" />
          <select id="cur" style="max-width:90px;">
            <option value="€"${config.currency==='€'?' selected':''}>€</option>
            <option value="$"${config.currency==='$'?' selected':''}>$</option>
            <option value="CHF"${config.currency==='CHF'?' selected':''}>CHF</option>
          </select>
        </div>
      `;
    } else {
      body.innerHTML = `
        <label for="inc">Revenu mensuel (net)</label>
        <div class="row"><input id="inc" type="number" inputmode="decimal" min="0" step="1" value="${config.income||''}" /></div>
        <label for="sav">Épargne visée par mois</label>
        <div class="row"><input id="sav" type="number" inputmode="decimal" min="0" step="1" value="${config.savingsGoal||''}" /></div>
        <label>Factures et charges fixes mensuelles</label>
        <div id="bills-list"></div>
        <button type="button" class="add-bill" id="add-bill">+ Ajouter une facture</button>
        <div class="calc-preview" id="calc-preview"></div>
      `;
      renderBillsList();
      ['inc','sav'].forEach(function(id){ document.getElementById(id).oninput = updatePreview; });
      document.getElementById('add-bill').onclick = function(){
        draftBills.push({id:'b'+Date.now(), label:'', amount:''});
        renderBillsList();
        updatePreview();
      };
      updatePreview();
    }
  }

  function renderBillsList(){
    const el = document.getElementById('bills-list');
    el.innerHTML = draftBills.map(function(b){
      return '<div class="bill-row">' +
        '<input type="text" placeholder="Loyer, électricité..." data-bill-label="' + b.id + '" value="' + (b.label||'').replace(/"/g,'&quot;') + '" />' +
        '<input type="number" inputmode="decimal" step="1" placeholder="0" data-bill-amount="' + b.id + '" value="' + (b.amount||'') + '" />' +
        '<button type="button" class="ghost" data-bill-del="' + b.id + '" aria-label="Supprimer">x</button>' +
      '</div>';
    }).join('');
    el.querySelectorAll('[data-bill-label]').forEach(function(inp){
      inp.oninput = function(){
        const b = draftBills.find(function(x){ return x.id === inp.getAttribute('data-bill-label'); });
        b.label = inp.value;
      };
    });
    el.querySelectorAll('[data-bill-amount]').forEach(function(inp){
      inp.oninput = function(){
        const b = draftBills.find(function(x){ return x.id === inp.getAttribute('data-bill-amount'); });
        b.amount = inp.value;
        updatePreview();
      };
    });
    el.querySelectorAll('[data-bill-del]').forEach(function(btn){
      btn.onclick = function(){
        draftBills = draftBills.filter(function(x){ return x.id !== btn.getAttribute('data-bill-del'); });
        renderBillsList();
        updatePreview();
      };
    });
  }

  function updatePreview(){
    const pv = document.getElementById('calc-preview');
    if(!pv) return;
    const income = parseFloat(document.getElementById('inc').value) || 0;
    const savings = parseFloat(document.getElementById('sav').value) || 0;
    const total = billsTotal(draftBills);
    const weekly = computeWeekly(income, draftBills, savings);
    pv.className = 'calc-preview' + (weekly < 0 ? ' neg' : '');
    pv.innerHTML = '<div class="calc-line"><span>Revenu</span><span>' + income.toLocaleString('fr-FR') + ' €</span></div>' +
      '<div class="calc-line"><span>Factures</span><span>-' + total.toLocaleString('fr-FR') + ' €</span></div>' +
      '<div class="calc-line"><span>Épargne</span><span>-' + savings.toLocaleString('fr-FR') + ' €</span></div>' +
      '<div style="font-family:\'Fraunces\',serif; font-size:22px; margin-top:8px;">' + weekly.toLocaleString('fr-FR', {maximumFractionDigits:0}) + ' € / semaine</div>';
  }

  document.getElementById('tab-simple').onclick = function(){ mode='simple'; renderBody(); };
  document.getElementById('tab-calc').onclick = function(){ mode='calc'; renderBody(); };
  renderBody();

  document.getElementById('settings-cancel').onclick = function(){
    view = 'home';
    draftBills = [];
    render();
  };

  document.getElementById('reset-carry').onclick = async function(){
    config.createdAt = new Date().toISOString();
    await saveConfig();
    view = 'home';
    draftBills = [];
    render();
  };

  document.getElementById('settings-save').onclick = async function(){
    const errEl = document.getElementById('setup-error');
    if(mode === 'simple'){
      const val = parseFloat(document.getElementById('wb').value);
      if(!val || val <= 0){
        errEl.textContent = "Entre un montant supérieur à 0.";
        errEl.style.display = 'block';
        return;
      }
      config = { weeklyBudget: val, currency: document.getElementById('cur').value, mode:'simple' };
    } else {
      const income = parseFloat(document.getElementById('inc').value) || 0;
      const savings = parseFloat(document.getElementById('sav').value) || 0;
      if(income <= 0){
        errEl.textContent = "Entre un revenu mensuel supérieur à 0.";
        errEl.style.display = 'block';
        return;
      }
      const bills = draftBills.filter(function(b){ return b.label.trim() !== '' || parseFloat(b.amount) > 0; })
        .map(function(b){ return {id:b.id, label:b.label.trim()||'Facture', amount: parseFloat(b.amount)||0}; });
      const weekly = computeWeekly(income, bills, savings);
      config = { weeklyBudget: Math.max(0, Math.round(weekly*100)/100), currency:'€', mode:'calc', income:income, savingsGoal:savings, bills:bills };
    }
    errEl.style.display = 'none';
    view = 'home';
    draftBills = [];
    await saveConfig();
    render();
  };
}

loadData();
</script>
